name: Atualizar eventos.json (Calendário de Contagem)

on:
  schedule:
    - cron: "0 19 * * *"  # todo dia às 16h de Brasília (19h UTC)
  workflow_dispatch:

permissions:
  contents: write

env:
  CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vTSywf-r_8jXN3OObrTSGGfRAKSYc44_X7NdiFms1GSLVJiuSABMrOMKf8P8KlATDq52751YKD0N14t/pub?gid=2075107518&single=true&output=csv

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar eventos.json
        run: python scripts/gerar_eventos.py

      - name: Gravar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add eventos.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração em eventos.json"
          else
            git commit -m "Atualiza eventos.json"
            git push
          fi
